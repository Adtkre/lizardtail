<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LizardTail - Self-Healing System Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 28px;
            font-size: 3.6em;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }

        h2 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            font-weight: 400;
        }

        /* ── CONTROLS ── */
        .controls {
            text-align: center;
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        button {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 26px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Bebas Neue', sans-serif;
        }
        button:hover { background: #ffffff; color: #0a0a0a; transform: translateY(-2px); }
        button.success { border-color: rgba(255,255,255,0.6); color: rgba(255,255,255,0.8); }
        button.success:hover { background: #ffffff; color: #0a0a0a; border-color: #ffffff; }

        /* ── TOP: 4 compact metric cards ── */
        .metric-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }

        .m-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .m-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }

        .m-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85em;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 3px;
        }

        .m-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2em;
            letter-spacing: 2px;
            line-height: 1;
            color: #ffffff;
        }
        .m-value.infected { animation: pulse 1s infinite; }
        .m-value.warning  { color: #fbbf24; }
        .m-value.critical { animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

        .status-badge {
            display: inline-block;
            padding: 5px 11px;
            font-size: 0.72em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Bebas Neue', sans-serif;
            border: 1px solid;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-healthy  { background: transparent; color: #ffffff; border-color: #ffffff; }
        .status-infected { background: #ffffff; color: #0a0a0a; border-color: #ffffff; }
        .status-running  { background: transparent; color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.35); }
        .status-warn     { background: transparent; color: #fbbf24; border-color: rgba(251,191,36,0.55); }

        /* ── BOTTOM: left col + logs ── */
        .bottom-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 14px;
        }

        .left-col { display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            padding: 20px 22px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.18); }
        .card h2 {
            margin-bottom: 14px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 10px;
            font-size: 1.4em;
        }

        /* containers */
        .container-list { list-style: none; }
        .container-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.07);
            padding: 10px 13px;
            margin: 7px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .container-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.16); }
        .container-item strong { font-weight: 500; font-size: 0.88em; }

        /* system metrics */
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 0.9em;
        }
        .metric:last-child { border-bottom: none; }
        .metric span:first-child { color: rgba(255,255,255,0.55); }
        .metric span:last-child  { color: #ffffff; font-weight: 600; }

        /* logs */
        .logs-card { display: flex; flex-direction: column; }

        .logs {
            height: 420px;
            overflow-y: auto;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e5e5;
            padding: 14px 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
        }
        .logs::-webkit-scrollbar { width: 6px; }
        .logs::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        .logs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.13); }
        .logs::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

        .log-entry {
            margin: 5px 0;
            padding: 6px 10px;
            border-left: 2px solid rgba(255,255,255,0.22);
        }
        .log-entry.ERROR     { border-left-color: #ffffff; background: rgba(255,255,255,0.04); }
        .log-entry.SUCCESS   { border-left-color: #ffffff; }
        .log-entry.HEALING   { border-left-color: rgba(255,255,255,0.5); }
        .log-entry.ATTACK    { border-left-color: #ffffff; background: rgba(255,255,255,0.06); }
        .log-entry.DETECTION { border-left-color: #fbbf24; background: rgba(251,191,36,0.07); }

        @media (max-width: 1000px) {
            .metric-row  { grid-template-columns: repeat(2,1fr); }
            .bottom-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.4em; }
            .metric-row { grid-template-columns: 1fr 1fr; }
            .controls   { flex-direction: column; }
        }
    </style>
</head>
<body>
<canvas class="bg-canvas" id="bgCanvas"></canvas>

<div class="container">

    <h1>LizardTail — Self-Healing System</h1>

    <!-- CONTROLS -->
    <div class="controls">
        <button class="danger" onclick="attackService()"> ATTACK SERVICE_A</button>
        <button class="success" onclick="healService()"> HEAL SERVICE_A</button>
    </div>

    <!-- TOP ROW: Temperature | CPU | Memory | Network -->
    <div class="metric-row">

        <div class="m-card">
            <div>
                <div class="m-title">Live Temperature</div>
                <div class="m-value normal" id="temperature">--</div>
            </div>
            <span class="status-badge status-healthy" id="service-status">LOADING</span>
        </div>

        <div class="m-card">
            <div>
                <div class="m-title">CPU Usage</div>
                <div class="m-value normal" id="cpu-value">--</div>
            </div>
            <span class="status-badge status-running" id="cpu-status">NORMAL</span>
        </div>

        <div class="m-card">
            <div>
                <div class="m-title">Memory Usage</div>
                <div class="m-value normal" id="memory-value">--</div>
            </div>
            <span class="status-badge status-running" id="memory-status">NORMAL</span>
        </div>

        <div class="m-card">
            <div>
                <div class="m-title">Network Traffic</div>
                <div class="m-value normal" id="network-value">--</div>
            </div>
            <span class="status-badge status-running" id="network-status">NORMAL</span>
        </div>

    </div>

    <!-- BOTTOM: left (containers + metrics) | right (logs) -->
    <div class="bottom-grid">

        <div class="left-col">
            <div class="card">
                <h2>Running Containers</h2>
                <ul class="container-list" id="container-list">
                    <li class="container-item"><span>Loading...</span></li>
                </ul>
            </div>

            <div class="card">
                <h2>System Metrics</h2>
                <div class="metric"><span>Total Requests</span><span id="total-requests">0</span></div>
                <div class="metric"><span>Failed Requests</span><span id="failed-requests">0</span></div>
                <div class="metric"><span>Avg Response Time</span><span id="avg-response">0ms</span></div>
                <div class="metric"><span>Heal Count</span><span id="heal-count">0</span></div>
            </div>
        </div>

        <div class="card logs-card">
            <h2>Event Logs</h2>
            <div class="logs" id="logs">
                <div class="log-entry">System initializing...</div>
            </div>
        </div>

    </div>
</div>

<script>
    /* BACKGROUND */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [], mouse = { x: null, y: null, radius: 150 };
    window.addEventListener('resize', () => { canvas.width=window.innerWidth; canvas.height=window.innerHeight; init(); });
    window.addEventListener('mousemove', e => { mouse.x=e.x; mouse.y=e.y; });
    window.addEventListener('touchmove', e => { mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; });
    class Particle {
        constructor(x,y){ this.x=x; this.y=y; this.size=Math.random()*2+0.5; this.baseX=x; this.baseY=y; this.density=(Math.random()*30)+1; this.opacity=Math.random()*0.5+0.1; }
        draw(){ ctx.fillStyle=`rgba(255,255,255,${this.opacity})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.closePath(); ctx.fill(); }
        update(){
            let dx=mouse.x-this.x, dy=mouse.y-this.y, d=Math.sqrt(dx*dx+dy*dy), force=(mouse.radius-d)/mouse.radius;
            if(d<mouse.radius){ this.x-=(dx/d)*force*this.density; this.y-=(dy/d)*force*this.density; }
            else { this.x+=(this.baseX-this.x)/10; this.y+=(this.baseY-this.y)/10; }
        }
    }
    function init(){ particles=[]; let n=(canvas.width*canvas.height)/15000; for(let i=0;i<n;i++) particles.push(new Particle(Math.random()*canvas.width,Math.random()*canvas.height)); }
    function connect(){ for(let a=0;a<particles.length;a++) for(let b=a;b<particles.length;b++){ let dx=particles[a].x-particles[b].x,dy=particles[a].y-particles[b].y,d=Math.sqrt(dx*dx+dy*dy); if(d<100){ctx.strokeStyle=`rgba(255,255,255,${(1-d/100)*0.1})`;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(particles[a].x,particles[a].y);ctx.lineTo(particles[b].x,particles[b].y);ctx.stroke();}}}
    function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.draw();p.update();}); connect(); requestAnimationFrame(animate); }
    init(); animate();

    /* STATE */
    let totalRequests=0, failedRequests=0, responseTimes=[], healCount=0;

    /* TEMPERATURE */
    async function fetchTemperature() {
        const t0=Date.now();
        try {
            const res=await fetch('http://127.0.0.1:5000/sensor');
            responseTimes.push(Date.now()-t0);
            if(responseTimes.length>20) responseTimes.shift();
            totalRequests++;
            const data=await res.json();
            const vEl=document.getElementById('temperature'), bEl=document.getElementById('service-status');
            vEl.textContent=data.temperature+'°C';
            if(data.status==='INFECTED'){ vEl.className='m-value infected'; bEl.className='status-badge status-infected'; bEl.textContent='INFECTED'; }
            else { vEl.className='m-value normal'; bEl.className='status-badge status-healthy'; bEl.textContent='HEALTHY'; }
            updateStats();
        } catch(e){ failedRequests++; totalRequests++; updateStats(); }
    }

    /* CPU / MEMORY / NETWORK */
    function setMetric(valId, badgeId, raw, unit) {
        const vEl=document.getElementById(valId), bEl=document.getElementById(badgeId);
        vEl.textContent=raw+unit;
        const n=parseFloat(raw);
        if(n>90){ vEl.className='m-value critical'; bEl.className='status-badge status-infected'; bEl.textContent='CRITICAL'; }
        else if(n>70){ vEl.className='m-value warning'; bEl.className='status-badge status-warn'; bEl.textContent='WARNING'; }
        else { vEl.className='m-value normal'; bEl.className='status-badge status-running'; bEl.textContent='NORMAL'; }
    }
    async function fetchMetrics() {
        try {
            const data=await(await fetch('http://127.0.0.1:5000/metrics')).json();
            setMetric('cpu-value','cpu-status',data.cpu,'%');
            setMetric('memory-value','memory-status',data.memory,'%');
            setMetric('network-value','network-status',data.network,' MB');
        } catch(e){}
    }

    /* CONTAINERS */
    async function fetchContainers() {
        try {
            const data=await(await fetch('http://127.0.0.1:8000/status')).json();
            const list=document.getElementById('container-list');
            list.innerHTML='';
            data.containers.forEach(c=>{ const li=document.createElement('li'); li.className='container-item'; li.innerHTML=`<span><strong>${c.name}</strong></span><span class="status-badge status-running">${c.status}</span>`; list.appendChild(li); });
        } catch(e){}
    }

    /* LOGS */
    async function fetchLogs() {
        try {
            const data=await(await fetch('http://127.0.0.1:8000/logs?limit=50')).json();
            const el=document.getElementById('logs');
            el.innerHTML='';
            data.logs.forEach(log=>{ const d=document.createElement('div'); d.className=`log-entry ${log.type}`; d.textContent=`[${log.timestamp}] ${log.type}: ${log.message}`; el.appendChild(d); });
            el.scrollTop=el.scrollHeight;
        } catch(e){}
    }

    /* STATS */
    function updateStats(){
        document.getElementById('total-requests').textContent=totalRequests;
        document.getElementById('failed-requests').textContent=failedRequests;
        document.getElementById('heal-count').textContent=healCount;
        if(responseTimes.length>0){ const avg=responseTimes.reduce((a,b)=>a+b,0)/responseTimes.length; document.getElementById('avg-response').textContent=Math.round(avg)+'ms'; }
    }

    /* BUTTONS */
    async function attackService(){ await fetch('http://127.0.0.1:8000/infect/service_a',{method:'POST'}); }
    async function healService(){ await fetch('http://127.0.0.1:8000/heal/lizardtail_service_a',{method:'POST'}); healCount++; updateStats(); }

    /* INTERVALS */
    setInterval(fetchTemperature,1000); setInterval(fetchMetrics,1000);
    setInterval(fetchContainers,2000);  setInterval(fetchLogs,2000);
    fetchTemperature(); fetchMetrics(); fetchContainers(); fetchLogs();
</script>
</body>
</html>
