<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LizardTail - Self-Healing System Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Interactive Background */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 4em;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }
        
        h2 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            font-weight: 400;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .card h2 {
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 12px;
            font-size: 1.8em;
        }
        
        .temperature {
            font-size: 4.5em;
            font-weight: 300;
            text-align: center;
            margin: 30px 0;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 3px;
        }
        
        .temperature.normal {
            color: #ffffff;
        }
        
        .temperature.infected {
            color: #ffffff;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 0;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Bebas Neue', sans-serif;
            border: 1px solid;
        }
        
        .status-healthy {
            background: transparent;
            color: #ffffff;
            border-color: #ffffff;
        }
        
        .status-infected {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #ffffff;
        }
        
        .status-running {
            background: transparent;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .status-exited {
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .container-list {
            list-style: none;
        }
        
        .container-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        
        .container-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .logs {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e5e5;
            padding: 20px;
            border-radius: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }
        
        .logs::-webkit-scrollbar {
            width: 8px;
        }
        
        .logs::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .logs::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 0;
        }
        
        .logs::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .log-entry {
            margin: 8px 0;
            padding: 8px;
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            padding-left: 12px;
        }
        
        .log-entry.ERROR {
            border-left-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .log-entry.SUCCESS {
            border-left-color: #ffffff;
        }
        
        .log-entry.HEALING {
            border-left-color: rgba(255, 255, 255, 0.6);
        }
        
        .log-entry.ATTACK {
            border-left-color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        
        button {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 14px 28px;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Bebas Neue', sans-serif;
        }
        
        button:hover {
            background: #ffffff;
            color: #0a0a0a;
            transform: translateY(-2px);
        }
        
        button.danger {
            border-color: #ffffff;
        }
        
        button.danger:hover {
            background: #ffffff;
            color: #0a0a0a;
        }
        
        button.success {
            border-color: rgba(255, 255, 255, 0.6);
            color: rgba(255, 255, 255, 0.8);
        }
        
        button.success:hover {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #ffffff;
        }
        
        .controls {
            text-align: center;
            margin: 30px 0 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95em;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric span:first-child {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .metric span:last-child {
            color: #ffffff;
            font-weight: 600;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
                letter-spacing: 2px;
            }
            
            .temperature {
                font-size: 3em;
            }
            
            button {
                padding: 12px 20px;
                font-size: 0.85em;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <canvas class="bg-canvas" id="bgCanvas"></canvas>
    
    <div class="container">
        <h1> LizardTail - Self-Healing System</h1>
        
        <div class="controls">
            <button class="danger" onclick="attackService()"> ATTACK SERVICE_A</button>
            <button class="success" onclick="healService()"> HEAL SERVICE_A</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2> Live Temperature:</h2>
                <div class="temperature normal" id="temperature">--</div>
                <div style="text-align: center;">
                    <span class="status-badge status-healthy" id="service-status">LOADING</span>
                </div>
            </div>
            
            <div class="card">
                <h2> Running Containers:</h2>
                <ul class="container-list" id="container-list">
                    <li>Loading...</li>
                </ul>
            </div>
            
            <div class="card">
                <h2> System Metrics:</h2>
                <div class="metric">
                    <span>Total Requests:</span>
                    <span id="total-requests">0</span>
                </div>
                <div class="metric">
                    <span>Failed Requests:</span>
                    <span id="failed-requests">0</span>
                </div>
                <div class="metric">
                    <span>Avg Response Time:</span>
                    <span id="avg-response">0ms</span>
                </div>
                <div class="metric">
                    <span>Heal Count:</span>
                    <span id="heal-count">0</span>
                </div>
            </div>
            
            <div class="card full-width">
                <h2> Event Logs:</h2>
                <div class="logs" id="logs">
                    <div class="log-entry">System initializing...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Interactive Background
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;
                
                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }
            }
        }
        
        function init() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                particles.push(new Particle(x, y));
            }
        }
        
        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        let opacity = 1 - (distance / 100);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw();
                particles[i].update();
            }
            connect();
            requestAnimationFrame(animate);
        }
        
        init();
        animate();
        
        // Original functionality
        let totalRequests = 0;
        let failedRequests = 0;
        let responseTimes = [];
        let healCount = 0;

        /* ---------------- TEMPERATURE ---------------- */
        async function fetchTemperature() {
            const startTime = Date.now();
            try {
                const response = await fetch('http://127.0.0.1:5000/sensor');
                const responseTime = Date.now() - startTime;
                responseTimes.push(responseTime);
                if (responseTimes.length > 20) responseTimes.shift();

                totalRequests++;

                const data = await response.json();
                const tempElement = document.getElementById('temperature');
                const statusElement = document.getElementById('service-status');

                tempElement.textContent = data.temperature + '°C';

                if (data.status === 'INFECTED') {
                    tempElement.className = 'temperature infected';
                    statusElement.className = 'status-badge status-infected';
                    statusElement.textContent = 'INFECTED';
                } else {
                    tempElement.className = 'temperature normal';
                    statusElement.className = 'status-badge status-healthy';
                    statusElement.textContent = 'HEALTHY';
                }

                updateMetrics();
            } catch (error) {
                failedRequests++;
                totalRequests++;
                console.error('Failed to fetch temperature:', error);
            }
        }

        /* ---------------- CONTAINERS ---------------- */
        async function fetchContainers() {
            try {
                const response = await fetch('http://127.0.0.1:8000/status');
                const data = await response.json();

                const listElement = document.getElementById('container-list');
                listElement.innerHTML = '';

                data.containers.forEach(container => {
                    const li = document.createElement('li');
                    li.className = 'container-item';
                    li.innerHTML = `
                        <span><strong>${container.name}</strong></span>
                        <span class="status-badge status-running">${container.status}</span>
                    `;
                    listElement.appendChild(li);
                });

            } catch (error) {
                console.log("container fetch error");
            }
        }

        /* ---------------- LOGS ---------------- */
        async function fetchLogs() {
            try {
                const response = await fetch('http://127.0.0.1:8000/logs?limit=30');
                const data = await response.json();

                const logsElement = document.getElementById('logs');
                logsElement.innerHTML = '';

                data.logs.forEach(log => {
                    const div = document.createElement('div');
                    div.className = `log-entry ${log.type}`;
                    div.textContent = `[${log.timestamp}] ${log.type}: ${log.message}`;
                    logsElement.appendChild(div);
                });

                logsElement.scrollTop = logsElement.scrollHeight;

            } catch (error) {
                console.log("log fetch error");
            }
        }

        /* ---------------- METRICS ---------------- */
        function updateMetrics() {
            document.getElementById('total-requests').textContent = totalRequests;
            document.getElementById('failed-requests').textContent = failedRequests;

            if (responseTimes.length > 0) {
                const avg = responseTimes.reduce((a,b)=>a+b,0)/responseTimes.length;
                document.getElementById('avg-response').textContent = Math.round(avg) + 'ms';
            }

            document.getElementById('heal-count').textContent = healCount;
        }

        /* ---------------- BUTTONS ---------------- */
        async function attackService() {
            await fetch('http://127.0.0.1:8000/infect/service_a', { method:'POST' });
        }

        async function healService() {
            await fetch('http://127.0.0.1:8000/heal/lizardtail_service_a', { method:'POST' });
            healCount++;
            updateMetrics();
        }

        /* ---------------- INTERVALS ---------------- */
        setInterval(fetchTemperature, 1000);
        setInterval(fetchContainers, 2000);
        setInterval(fetchLogs, 2000);

        fetchTemperature();
        fetchContainers();
        fetchLogs();
    </script>
</body>
</html>
